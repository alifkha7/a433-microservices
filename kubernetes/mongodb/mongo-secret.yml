# ==============================================================================
# Manifest Secret: mongo-secret.yml
# Objek Kubernetes Secret untuk menyimpan kredensial administratif basis data
# MongoDB secara terenkapsulasi dalam bentuk base64 encoding.
# ==============================================================================
apiVersion: v1
# Jenis resource Kubernetes yang digunakan untuk menyimpan data sensitif
kind: Secret
metadata:
  # Nama unik secret yang akan direferensikan oleh StatefulSet MongoDB dan Backend API
  name: mongo-secret
  labels:
    # Label klasifikasi komponen aplikasi
    app: karsajobs
    component: mongodb
# Tipe secret default untuk data konfigurasi pengguna umum
type: Opaque
data:
  # Nilai username admin dalam format base64 (string asli: 'admin')
  MONGO_ROOT_USERNAME: YWRtaW4=
  # Nilai password admin dalam format base64 (string asli: 'supersecretpassword')
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
